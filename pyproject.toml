[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ─────────────────────────────────────────────────────────────────────────────
# Project metadata
# ─────────────────────────────────────────────────────────────────────────────
[project]
name = "tiny-crnn-wakeword"
version = "0.1.0"
description = "Tiny-CRNN streaming wakeword detection (PyTorch implementation of Khursheed et al., 2022)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = ["wakeword", "keyword-spotting", "speech", "pytorch", "crnn", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# ─────────────────────────────────────────────────────────────────────────────
# Core runtime dependencies
# ─────────────────────────────────────────────────────────────────────────────
dependencies = [
    # Deep learning
    "torch>=2.1,<3.0",
    "torchaudio>=2.1,<3.0",
    "pydub",

    # Numerics & data
    "numpy>=1.24,<3.0",
    "scipy>=1.10",

    # Audio I/O backends used by torchaudio
    "soundfile>=0.12",     # libsndfile bindings (cross-platform WAV/FLAC)

    # Evaluation & plotting
    "scikit-learn>=1.3",   # ROC/DET helpers
    "matplotlib>=3.7",     # DET curves, spectrogram visualization

    # Utilities
    "tqdm>=4.65",          # progress bars in training loops
    "pyyaml>=6.0",         # config files
    "torchcodec (>=0.11.1,<0.12.0)",
]

# ─────────────────────────────────────────────────────────────────────────────
# Optional extras
# ─────────────────────────────────────────────────────────────────────────────
[project.optional-dependencies]

# Development tooling: linting, formatting, testing
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",           # fast linter + formatter
    "black>=24.0",
    "mypy>=1.8",
    "ipython>=8.10",
    "pydub"
]

# Experiment tracking / notebooks
notebook = [
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
    "tensorboard>=2.15",
]

# Optional advanced audio augmentation
audio-extras = [
    "librosa>=0.10",       # extra DSP utilities
    "audiomentations>=0.34",  # rich waveform augmentations
    "pyroomacoustics>=0.7",   # room impulse response simulation
]

# ONNX export for deploying the trained model on-device
deploy = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
]

# Convenience meta-extra


# ─────────────────────────────────────────────────────────────────────────────
# Project URLs (optional but nice to have)
# ─────────────────────────────────────────────────────────────────────────────
[project.urls]
Homepage = "https://github.com/your-org/tiny-crnn-wakeword"
Repository = "https://github.com/your-org/tiny-crnn-wakeword"
Issues = "https://github.com/your-org/tiny-crnn-wakeword/issues"

# ─────────────────────────────────────────────────────────────────────────────
# Setuptools configuration
# ─────────────────────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tiny_crnn_wakeword" = ["py.typed"]

# ─────────────────────────────────────────────────────────────────────────────
# Tooling configuration
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]   # line length handled by formatter

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=tiny_crnn_wakeword --cov-report=term-missing"